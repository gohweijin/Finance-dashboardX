      saved.expenses.forEach(se=>{
        if(seedIds.has(se.id)){
          const e=base.expenses.find(x=>x.id===se.id);
          if(e){e.who=se.who;e.ss=se.ss||0;}
        } else {
          // User-added txn — include it
          if(!base.expenses.find(x=>x.id===se.id))
            base.expenses.push(Object.assign({},se));
        }
      });
      // Respect user deletions of seed txns
      const savedIds=new Set(saved.expenses.map(e=>e.id));
      base.expenses=base.expenses.filter(e=>!seedIds.has(e.id)||savedIds.has(e.id));
      if(saved.settled)base.settled=saved.settled;
      if(saved.cpf)base.cpf=saved.cpf;
      if(saved.assets&&saved.assets.length)base.assets=saved.assets;
      if(saved.liabilities&&saved.liabilities.length)base.liabilities=saved.liabilities;
      if(saved.income)Object.entries(saved.income).forEach(([m,v])=>{base.income[m]=v;});
      break;
    }catch(e){}
  }
  return base;
}

function calcSettle(exps){
  const wc=exps.filter(e=>gh(e)==='w'),hc=exps.filter(e=>gh(e)==='h');
  const wh=wc.filter(e=>e.who==='him'&&ga(e)>0),wj=wc.filter(e=>e.who==='joint'&&ga(e)>0);
  const hj=hc.filter(e=>e.who==='joint'&&ga(e)>0),hm=hc.filter(e=>e.who==='me'&&ga(e)>0);
  const sum=a=>a.reduce((s,e)=>s+ga(e),0);
  const how=sum(wh)+sum(wj)*.5,woh=sum(hj)*.5+sum(hm);
  return{wh,wh_a:sum(wh),wj,wj_a:sum(wj)*.5,how,hj,hj_a:sum(hj)*.5,hm,hm_a:sum(hm),woh,net:how-woh,
    sis:exps.reduce((s,e)=>s+(parseFloat(e.ss)||0),0),sisx:exps.filter(e=>parseFloat(e.ss)>0)};
}

function drawMonthChart(){
  const months=[...new Set(S.expenses.map(e=>em(e)).filter(Boolean))].sort();
  const el=document.getElementById('mChart');
  if(!months.length){if(el)el.innerHTML='';return;}
  const rows=months.map(function(mo){
    const inc=S.income[mo]||{me:0,him:0,other:0};
    const ti=(inc.me||0)+(inc.him||0)+(inc.other||0);
    const ex=S.expenses.filter(function(e){return em(e)===mo;});
    const oe=ex.filter(isO).reduce(function(s,e){return s+ga(e)-(parseFloat(e.ss)||0);},0);
    return{mo:mo,ti:ti,oe:oe,sv:ti-oe};
  });
  // Compute YTD cumulative to include in maxV
  var year=cur.split('-')[0];
  var ytdRows=rows.filter(function(r){return r.mo.startsWith(year);});
  var runTi=0,runOe=0,ytdMaxV=1;
  ytdRows.forEach(function(r){runTi+=r.ti;runOe+=r.oe;ytdMaxV=Math.max(ytdMaxV,runTi,runOe,Math.abs(runTi-runOe));});
  const maxV=Math.max.apply(null,rows.map(function(r){return Math.max(r.ti,r.oe,Math.abs(r.sv));}).concat([ytdMaxV,1]));
  const axW=38,bw=46,gap=5,gw=3*bw+2*gap,pw=18;
  const chartW=axW+rows.length*(gw+pw)+pw;
  const chartH=140;
  const mnames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  // Y axis tick values - 5 ticks from 0 to maxV
  var ticks=[];
  for(var ti2=0;ti2<=4;ti2++){ticks.push(Math.round(maxV*ti2/4));}
  var svg='<svg viewBox="0 0 '+chartW+' '+(chartH+52)+'" style="width:100%;font-family:var(--font-mono)">';
  // Grid lines + Y axis labels
  ticks.forEach(function(tick,i){
    var y=8+(4-i)*(chartH/4);
    svg+='<line x1="'+axW+'" y1="'+y+'" x2="'+chartW+'" y2="'+y+'" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>';
    svg+='<text x="'+(axW-3)+'" y="'+(y+3)+'" text-anchor="end" font-size="7.5" fill="var(--color-text-secondary)">'+Math.round(tick/1000)+'k</text>';
  });
  // Y axis line
  svg+='<line x1="'+axW+'" y1="8" x2="'+axW+'" y2="'+(8+chartH)+'" stroke="var(--color-border-secondary)" stroke-width="0.5"/>';
  function scaleY(v){return 8+chartH-Math.max(0,Math.min(chartH*0.95,Math.round((Math.abs(v)/maxV)*chartH*0.9)));}
  // Bars
  rows.forEach(function(r,i){
    var x=axW+pw+i*(gw+pw);
    function bH(v){return Math.max(2,Math.round((Math.abs(v)/maxV)*chartH*0.9));}
    var ih=bH(r.ti),eh=bH(r.oe),sv=r.sv,sh=bH(sv);
    svg+='<rect x="'+x+'" y="'+(8+chartH-ih)+'" width="'+bw+'" height="'+ih+'" fill="#1D9E75" rx="2" opacity="0.85"/>';
    svg+='<text x="'+(x+bw/2)+'" y="'+(8+chartH-ih-3)+'" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">'+Math.round(r.ti/1000)+'k</text>';
    svg+='<rect x="'+(x+bw+gap)+'" y="'+(8+chartH-eh)+'" width="'+bw+'" height="'+eh+'" fill="#D85A30" rx="2" opacity="0.85"/>';
    svg+='<text x="'+(x+bw+gap+bw/2)+'" y="'+(8+chartH-eh-3)+'" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">'+Math.round(r.oe/1000)+'k</text>';
    var sy=sv>=0?8+chartH-sh:8+chartH;
    svg+='<rect x="'+(x+2*(bw+gap))+'" y="'+sy+'" width="'+bw+'" height="'+sh+'" fill="'+(sv>=0?'#378ADD':'#c0392b')+'" rx="2" opacity="0.85"/>';
    svg+='<text x="'+(x+2*(bw+gap)+bw/2)+'" y="'+(sv>=0?Math.max(12,sy-3):Math.min(8+chartH+11,sy+sh+10))+'" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">'+(sv>=0?'':'-')+Math.round(Math.abs(sv)/1000)+'k</text>';
    var p=r.mo.split('-');
    svg+='<text x="'+(x+gw/2)+'" y="'+(8+chartH+14)+'" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)" font-weight="500">'+mnames[+p[1]-1]+' '+p[0].slice(2)+'</text>';
  });
  // YTD cumulative lines
  if(ytdRows.length>1){
    var tiPts=[],oePts=[],svPts=[];
    var cumTi=0,cumOe=0;
    ytdRows.forEach(function(r){
      cumTi+=r.ti; cumOe+=r.oe;
      var cumSv=cumTi-cumOe;
      var ri=rows.indexOf(r);
      var cx=axW+pw+ri*(gw+pw)+gw/2;
      tiPts.push([cx,scaleY(cumTi)]);
      oePts.push([cx,scaleY(cumOe)]);
      svPts.push([cx,cumSv>=0?scaleY(cumSv):Math.min(8+chartH,scaleY(0)+10)]);
    });
    function pts2path(pts){return pts.map(function(p,i){return (i===0?'M':'L')+p[0]+' '+p[1];}).join(' ');}
    function mkDots(pts,col){return pts.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="'+col+'" stroke="white" stroke-width="1.5"/>';}).join('');}
    svg+='<path d="'+pts2path(tiPts)+'" fill="none" stroke="#1D9E75" stroke-width="2.5" stroke-dasharray="6,3"/>';
    svg+='<path d="'+pts2path(oePts)+'" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-dasharray="6,3"/>';
    svg+='<path d="'+pts2path(svPts)+'" fill="none" stroke="#378ADD" stroke-width="2.5" stroke-dasharray="6,3"/>';
    svg+=mkDots(tiPts,'#1D9E75')+mkDots(oePts,'#D85A30')+mkDots(svPts,'#378ADD');
    // YTD value labels at last point
    var lastTi=tiPts[tiPts.length-1],lastOe=oePts[oePts.length-1],lastSv=svPts[svPts.length-1];
    svg+='<text x="'+(lastTi[0]+6)+'" y="'+(lastTi[1]+4)+'" font-size="8" fill="#1D9E75" font-weight="600">'+Math.round(cumTi/1000)+'k</text>';
    svg+='<text x="'+(lastOe[0]+6)+'" y="'+(lastOe[1]+4)+'" font-size="8" fill="#D85A30" font-weight="600">'+Math.round(cumOe/1000)+'k</text>';
    svg+='<text x="'+(lastSv[0]+6)+'" y="'+(lastSv[1]+4)+'" font-size="8" fill="#378ADD" font-weight="600">'+Math.round((cumTi-cumOe)/1000)+'k</text>';
  }
  // Legend
  var lx=axW+4,ly=chartH+28;
  svg+='<rect x="'+lx+'" y="'+ly+'" width="7" height="7" fill="#1D9E75" rx="1"/><text x="'+(lx+10)+'" y="'+(ly+7)+'" font-size="7.5" fill="var(--color-text-secondary)">Income</text>';
  svg+='<rect x="'+(lx+52)+'" y="'+ly+'" width="7" height="7" fill="#D85A30" rx="1"/><text x="'+(lx+62)+'" y="'+(ly+7)+'" font-size="7.5" fill="var(--color-text-secondary)">Expenses</text>';
  svg+='<rect x="'+(lx+125)+'" y="'+ly+'" width="7" height="7" fill="#378ADD" rx="1"/><text x="'+(lx+135)+'" y="'+(ly+7)+'" font-size="7.5" fill="var(--color-text-secondary)">Savings</text>';
  svg+='<line x1="'+(lx+190)+'" y1="'+(ly+3)+'" x2="'+(lx+208)+'" y2="'+(ly+3)+'" stroke="#666" stroke-width="2" stroke-dasharray="5,2"/><text x="'+(lx+212)+'" y="'+(ly+7)+'" font-size="7.5" fill="var(--color-text-secondary)">YTD cumulative (dotted)</text>';
  svg+='</svg>';
  if(el)el.innerHTML=svg;
}

function drawChangeLog(){
  const el=document.getElementById('changeLog');
  if(!el)return;
  // Build seed lookup
  const seedMap={};
  SEED.forEach(function(s){seedMap[s.id]=s;});
  // Find differences between current state and seed
  const diffs=[];
  S.expenses.forEach(function(e){
    const s=seedMap[e.id];
    if(!s)return; // user-added txn, skip
    const changes=[];
    if(e.who!==s.who) changes.push('who: '+s.who+' → '+e.who);
    if(e.cat!==s.cat) changes.push('cat: '+s.cat+' → '+e.cat);
    if((e.b||'no')!==(s.b||'no')) changes.push('behalf: '+(s.b||'no')+' → '+(e.b||'no'));
    if((parseFloat(e.ss)||0)!==(parseFloat(s.ss)||0)) changes.push('sis: '+(s.ss||0)+' → '+(e.ss||0));
    if(changes.length) diffs.push({id:e.id,desc:e.desc,td:e.td,changes:changes});
  });
  // Also find deleted seed txns
  const currentIds=new Set(S.expenses.map(function(e){return e.id;}));
  SEED.forEach(function(s){
    if(!currentIds.has(s.id)) diffs.push({id:s.id,desc:s.desc,td:s.td,changes:['DELETED']});
  });
  if(!diffs.length){
    el.innerHTML='<div style="font-size:11px;color:var(--color-text-secondary);padding:6px 0">No manual changes vs seed data.</div>';
    return;
  }
  var rows=diffs.map(function(d){
    return '<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;border-bottom:.5px solid var(--color-border-tertiary);font-size:11px;gap:8px">'
      +'<div style="flex:1"><b>'+d.desc+'</b><span style="color:var(--color-text-secondary);margin-left:5px;font-size:10px">'+fdt(d.td)+'</span></div>'
      +'<div style="text-align:right;color:var(--color-text-warning);font-size:10px">'+d.changes.join(' | ')+'</div>'
      +'</div>';
  }).join('');
  el.innerHTML='<div style="margin-top:2px">'
    +'<div style="font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-secondary);margin-bottom:6px">Manual changes vs seed ('+diffs.length+')</div>'
    +rows+'</div>';
}

function toggleCatDrill(catId,mode){
  mode=mode||'monthly';

  if(!el)return;
  if(el.style.display!=='none'){el.style.display='none';return;}
  const year=cur.split('-')[0];
  const exps=(mode==='ytd'
    ? S.expenses.filter(e=>isO(e)&&(e.sd||e.td||'').startsWith(year))

function rLR(){
  const exps=S.expenses.filter(e=>{
    if(LF.mo&&em(e)!==LF.mo)return false;
    if(LF.h&&gh(e)!==LF.h)return false;
    if(LF.bk&&(e.bk||'')!==LF.bk)return false;
    if(LF.w&&e.who!==LF.w)return false;
    if(LF.c&&e.cat!==LF.c)return false;
    if(LF.b==='no'&&!isO(e))return false;
    if(LF.b&&LF.b!=='no'&&e.b!==LF.b)return false;
    if(LF.s&&!(e.desc||'').toLowerCase().includes(LF.s.toLowerCase()))return false;
    return true;
  }).sort((a,b)=>(b.td||'').localeCompare(a.td||''));
  const tot=exps.reduce((s,e)=>s+ga(e),0);
  const lc=document.getElementById('lc'),lt=document.getElementById('lt');
  if(lc)lc.textContent=exps.length+' txns';
  if(lt)lt.textContent=fd(tot);
  const rows=document.getElementById('lrows');
  if(!rows)return;
  if(!exps.length){rows.innerHTML='<div class="empty">No transactions match.</div>';return;}
  rows.innerHTML=exps.map(e=>{
    const c=gc(e.cat),d=gdow(e.td);
    const ds=d===0?'color:#c0392b;font-weight:600':d===3?'color:#1a7a4a;font-weight:600':'color:#888';
    const no=!isO(e),ss=parseFloat(e.ss)||0,isH=gh(e)==='h',cr=isCr(e);
    return`<div class="lrow lcols${no?' ob':''}${cr?' cr':''}">
      <div style="color:#888">${fdt(e.sd)}</div>
      <div style="color:#888">${fdt(e.td)}</div>
      <div style="${ds}">${gdn(e.td)}</div>
      <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.desc}${e.bk==='Cash'?' <span class="pill cpill">cash</span>':''}${cr?'<span class="pill crpill">credit</span>':''}${ss>0?'<span style="font-size:9px;padding:1px 4px;border-radius:3px;background:#ede9fe;color:#6d28d9;margin-left:3px">sis</span>':''}</div>
      <div style="color:#888;font-size:10px">${e.bk||'—'}</div>
      <div style="color:#888;font-size:10px">${isH?'<span style="font-size:9px;background:#fef3c7;color:#92400e;padding:1px 4px;border-radius:3px">H</span>':'W'}</div>
      <div><select class="isel" style="max-width:90px;background:${c.c}22;color:${c.c};border-color:${c.c}44;font-weight:600" onchange="upCat('${e.id}',this.value)">${CATS.map(ct=>`<option value="${ct.id}"${e.cat===ct.id?' selected':''}>${ct.n}</option>`).join('')}</select></div>

      <div><select class="isel" style="max-width:75px;${no?'color:#92400e':''}" onchange="upB('${e.id}',this.value)"><option value="no"${(e.b||'no')==='no'?' selected':''}>— Ours</option><option value="mum"${e.b==='mum'?' selected':''}>Mum</option><option value="siblings"${e.b==='siblings'?' selected':''}>Siblings</option><option value="other"${e.b==='other'?' selected':''}>Other</option></select></div>
      <div><input class="iinp" type="number" placeholder="—" min="0" step="0.01" value="${ss||''}" onchange="upSS('${e.id}',this.value)"></div>
      <div class="ar" style="color:${cr?'#15803d':(no?'#aaa':'')}">${cr?'−':''}${fd(Math.abs(ga(e)))}</div>
      <div><button class="delbtn" onclick="delE('${e.id}')">×</button></div>
    </div>`;
  }).join('');
}

function tjLoad(){
  try{
    const r=localStorage.getItem(TJ_STORAGE_KEY);
    if(r){
      const d=JSON.parse(r);
      if(d&&d.trades&&d.trades.length&&d.trades.every(t=>Array.isArray(t.exits)&&t.tradeType))return d;
      if(d&&d.trades&&Array.isArray(d.trades)){
        const existingIds=new Set(d.trades.map(t=>t.id));
        TJ_SEED.forEach(s=>{
          if(existingIds.has(s.id)){const t=d.trades.find(x=>x.id===s.id);if(t&&!t.tradeType)t.tradeType=s.tradeType||'swing';}
          else{d.trades.push(Object.assign({},s,{exits:(s.exits||[]).map(x=>Object.assign({},x))}));}
        });
        d.trades.forEach(t=>{if(!t.tradeType)t.tradeType='swing';if(!Array.isArray(t.exits))t.exits=[];});
        tjSave(d);return d;
      }
    }
  }catch(e){}
  const fresh={trades:TJ_SEED.map(t=>Object.assign({},t,{exits:(t.exits||[]).map(x=>Object.assign({},x))}))};
  tjSave(fresh);return fresh;
}
function tjSave(data){try{localStorage.setItem(TJ_STORAGE_KEY,JSON.stringify(data));}catch(e){}}

// ── Helpers ──
function tjCalcLegPnL(direction,entry,exitPrice,shares){
  const e=parseFloat(entry),x=parseFloat(exitPrice),sh=parseFloat(shares);
  if(!e||!x||!sh)return 0;
  return (direction==='LONG'?x-e:e-x)*sh;
}
// ── Tranches (scale-in entries) ──
// trade.tranches: [{id,date,price,shares,fee}] — optional. When present, these
// replace the single entry/shares/entryFee fields for cost-basis purposes.
// Average-cost method: avg entry = weighted avg of all tranche prices.
function tjAvgEntry(t){
  if(t.tranches&&t.tranches.length){
    const totalSh=t.tranches.reduce((s,tr)=>s+(parseFloat(tr.shares)||0),0);
    if(!totalSh)return parseFloat(t.entry)||0;
    const cost=t.tranches.reduce((s,tr)=>s+(parseFloat(tr.price)||0)*(parseFloat(tr.shares)||0),0);
    return cost/totalSh;
  }
  return parseFloat(t.entry)||0;
}
function tjTotalShares(t){
  if(t.tranches&&t.tranches.length)return t.tranches.reduce((s,tr)=>s+(parseFloat(tr.shares)||0),0);
  return parseFloat(t.shares)||0;
}
function tjEntryFeesTotal(t){
  if(t.tranches&&t.tranches.length)return t.tranches.reduce((s,tr)=>s+(parseFloat(tr.fee)||0),0);
  return parseFloat(t.entryFee)||0;
}
// Trim a numeric price to at most 4dp without forcing trailing zeros
function tjFmtPrice(v){
  const n=parseFloat(v);
  if(isNaN(n))return '';
  let s=n.toFixed(4).replace(/0+$/,'').replace(/\.$/,'');
  return s;
}
// Total fees for a trade: entry fee(s) + sum of exit fees
function tjTotalFees(t){
  const ef=tjEntryFeesTotal(t);
  const xf=t.exits?t.exits.reduce((s,ex)=>s+(parseFloat(ex.fee)||0),0):0;
  return ef+xf;
}
// Total realised P&L (gross, before fees) — handles both new exits[] and legacy exitPrice
// Uses average entry price across tranches when scaled in.
function tjTotalPnL(t){
  const avgEntry=tjAvgEntry(t);
  if(t.exits&&t.exits.length){
    return t.exits.reduce((s,ex)=>s+tjCalcLegPnL(t.direction,avgEntry,ex.price,ex.shares),0);
  }
  if(t.exitPrice){return tjCalcLegPnL(t.direction,avgEntry,t.exitPrice,t.shares);}
  return null;
}
// Net P&L after fees
function tjNetPnL(t){
  const gross=tjTotalPnL(t);
  if(gross===null)return null;
  return gross-tjTotalFees(t);
}
// Shares still open
function tjRemainingShares(t){
  const total=tjTotalShares(t);
  if(!t.exits||!t.exits.length)return total;
  const exited=t.exits.reduce((s,ex)=>s+(parseFloat(ex.shares)||0),0);
  return Math.max(0,total-exited);
}
// Derive status from exits (uses net P&L)
function tjDeriveStatus(t){
  if(!t.exits||!t.exits.length)return'OPEN';
  const rem=tjRemainingShares(t);
  if(rem>0)return'OPEN'; // partial — still open
  const pnl=tjNetPnL(t);
  if(pnl===null)return'OPEN';
  if(Math.abs(pnl)<0.01)return'BREAKEVEN';
  return pnl>0?'WIN':'LOSS';
}
function tjCalcRR(entry,sl,tp){
  const e=parseFloat(entry),s=parseFloat(sl),t=parseFloat(tp);
  if(!e||!s||!t)return null;
  return(Math.abs(t-e)/Math.abs(e-s)).toFixed(2);
}
function tjCalcShares(risk,entry,sl){
  const r=parseFloat(risk),e=parseFloat(entry),s=parseFloat(sl);
  if(!r||!e||!s)return'';
  return Math.floor(r/Math.abs(e-s));
}
function tjFmtPnL(pnl){
  if(pnl===null)return'—';
  const v=parseFloat(pnl);
  return(v>=0?'+':'')+v.toFixed(2);
}
// Realised R — returns {grossR, netR, grossLabel, netLabel, isRunning} or null
function tjRealisedR(t){
  const risk=parseFloat(t.risk);
  if(!risk)return null;
  const gross=tjTotalPnL(t);
  if(gross===null||(gross===0&&!(t.exits&&t.exits.length)))return null;
  const fees=tjTotalFees(t);
  const net=gross-fees;
  const running=tjRemainingShares(t)>0;
  const fmt=(v)=>(v>=0?'+':'')+v.toFixed(2)+'R'+(running?' (running)':'');
  return{grossR:gross/risk,netR:net/risk,grossLabel:fmt(gross/risk),netLabel:fmt(net/risk),isRunning:running,fees};
}

// ── Equity Curve ──
function tjBuildEquityCurve(trades){
  // Build chronological list of exit events with cumulative P&L
  const start=TJ_ACCOUNT.startCapitalUSD||14975.62;
  const events=[];
  trades.forEach(t=>{
    const avgEntry=tjAvgEntry(t);
    // Trades with tranches: each tranche's fee hits equity on its own date
    if(t.tranches&&t.tranches.length){
      t.tranches.forEach(tr=>{
        const fee=parseFloat(tr.fee)||0;
        if(fee>0)events.push({date:tr.date,ticker:t.ticker,pnl:-fee,type:'ENTRY'});
      });
    }
    if(!t.exits||!t.exits.length)return;
    t.exits.forEach(ex=>{
      const pnl=tjCalcLegPnL(t.direction,avgEntry,ex.price,ex.shares);
      const fee=parseFloat(ex.fee)||0;
      events.push({date:ex.date,ticker:t.ticker,pnl:pnl-fee,type:ex.type});
    });
    // Legacy single-entry trades: distribute entry fee to first exit (unchanged behaviour)
    if(!(t.tranches&&t.tranches.length)){
      const ef=parseFloat(t.entryFee)||0;
      if(ef>0&&t.exits.length){
        events[events.length-1].pnl-=ef;
      }
    }
  });
  // Sort by date
  events.sort((a,b)=>a.date.localeCompare(b.date));
  // Build cumulative curve
  const points=[{date:'Start',label:'Start',equity:start,pnl:0}];
  let running=start;
  events.forEach(ev=>{
    running+=ev.pnl;
    points.push({date:ev.date,label:ev.ticker,equity:running,pnl:ev.pnl});
  });
  return points;
}
// Time-weighted return: chain-links the return of each event over the equity
// immediately preceding it, so compounding is reflected accurately (unlike
// simple return, which just divides total P&L by starting capital).
function tjTWR(points){
  let twr=1;
  for(let i=1;i<points.length;i++){
    const prev=points[i-1].equity;
    if(prev<=0)continue;
    twr*=(1+points[i].pnl/prev);
  }
  return (twr-1)*100;
}
// XIRR: annualised, money-weighted return. Root-solves for rate r such that
// sum(CF_i / (1+r)^(days_i/365)) = 0, treating start capital as a dated outflow
// and current equity as a dated inflow "today" (plus any recorded deposits/
// withdrawals in TJ_ACCOUNT.cashFlows). Unlike TWR, this is NOT mathematically
// forced to equal simple return — it annualises, and will diverge from TWR
// once real cash flows are added.
function tjXIRR(trades,start,current){
  if(!trades||!trades.length)return null;
  const startDate=trades.map(t=>t.date).sort()[0];
  const today=new Date().toISOString().slice(0,10);
  if(!startDate||startDate>=today)return null;
  const flows=[{date:startDate,amount:-start}];
  (TJ_ACCOUNT.cashFlows||[]).forEach(cf=>{if(cf&&cf.date&&cf.date>startDate&&cf.date<today)flows.push({date:cf.date,amount:cf.amount});});
  flows.push({date:today,amount:current});
  const t0=new Date(startDate).getTime();
  const days=flows.map(f=>(new Date(f.date).getTime()-t0)/86400000);
  let rate=0.15;
  for(let i=0;i<80;i++){
    let f=0,df=0;
    for(let j=0;j<flows.length;j++){
      const yrs=days[j]/365;
      const denom=Math.pow(1+rate,yrs);
      if(!isFinite(denom)||denom===0)continue;
      f+=flows[j].amount/denom;
      df+=-yrs*flows[j].amount/Math.pow(1+rate,yrs+1);
    }
    if(Math.abs(df)<1e-9)break;
    const next=rate-f/df;
    if(!isFinite(next)){break;}
    if(next<=-0.999999){rate=-0.9;break;}
    if(Math.abs(next-rate)<1e-7){rate=next;break;}
    rate=next;
  }
  if(!isFinite(rate))return null;
  return rate*100;
}
function tjEquityCurveHTML(trades){
  const pts=tjBuildEquityCurve(trades);
  if(pts.length<2)return'';
  const w=520,h=160,padL=64,padR=16,padT=16,padB=28;
  const cw=w-padL-padR,ch=h-padT-padB;

  const range=maxE-minE||1;
  const start=TJ_ACCOUNT.startCapitalUSD||14975.62;
  const current=equities[equities.length-1];
  const totalPnL=current-start;
  const pct=(totalPnL/start*100).toFixed(1);
  const twrPct=tjTWR(pts).toFixed(1);
  const xirrRaw=tjXIRR(trades,start,current);
  const xirrPct=xirrRaw===null?null:xirrRaw.toFixed(1);
  const pc=totalPnL>=0?'#4ade80':'#f87171';
  const twrC=parseFloat(twrPct)>=0?'#4ade80':'#f87171';
  const xirrC=xirrPct===null?'#888':(parseFloat(xirrPct)>=0?'#4ade80':'#f87171');

    +'<rect x="'+padL+'" y="'+padT+'" width="'+cw+'" height="'+ch+'" fill="#1a1a1a" rx="3"/>'
    +yLabels.map(l=>'<line x1="'+padL+'" y1="'+l.y.toFixed(1)+'" x2="'+(padL+cw)+'" y2="'+l.y.toFixed(1)+'" stroke="#333" stroke-width="0.5"/>'
      +'<text x="'+(padL-4)+'" y="'+l.y.toFixed(1)+'" fill="#666" font-size="8" text-anchor="end" dominant-baseline="middle">'+l.label+'</text>').join('')
    +(baseY>=padT&&baseY<=padT+ch?'<line x1="'+padL+'" y1="'+baseY.toFixed(1)+'" x2="'+(padL+cw)+'" y2="'+baseY.toFixed(1)+'" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>':'')
    +'<path d="'+fill+'" fill="url(#ec_grad)"/>'

  return '<div class="card" style="background:#111;color:#fff;border-radius:8px;padding:14px 16px;margin-bottom:16px">'

// ── P&L by Month ──
function tjPnLByMonthHTML(trades){
  const months={};
  trades.forEach(t=>{
    const avgEntry=tjAvgEntry(t);
    if(t.tranches&&t.tranches.length){
      t.tranches.forEach(tr=>{
        const fee=parseFloat(tr.fee)||0;
        if(fee>0){const m=tr.date.slice(0,7);if(!months[m])months[m]={pnl:0};months[m].pnl-=fee;}
      });
    }
    if(!t.exits||!t.exits.length)return;
    t.exits.forEach(ex=>{
      const m=ex.date.slice(0,7);
      if(!months[m])months[m]={pnl:0};
      const pnl=tjCalcLegPnL(t.direction,avgEntry,ex.price,ex.shares)-(parseFloat(ex.fee)||0);
      months[m].pnl+=pnl;
    });
    if(!(t.tranches&&t.tranches.length)){
      const ef=parseFloat(t.entryFee)||0;
      if(ef>0&&t.exits.length){const m=t.exits[0].date.slice(0,7);if(months[m])months[m].pnl-=ef;}
    }
  });
  const mkeys=Object.keys(months).sort();
  if(!mkeys.length)return'';
  const vals=mkeys.map(m=>months[m].pnl);
  const totalPnL=vals.reduce((a,b)=>a+b,0);
  const pc=totalPnL>=0?'#4ade80':'#f87171';
  const maxAbs=Math.max(...vals.map(Math.abs),1);
  // Fixed-height vertical column chart — stays compact regardless of month count
  const w=520,h=130,padL=10,padR=10,padT=10,padB=28;
  const cw=w-padL-padR,ch=h-padT-padB;
  const n=mkeys.length;
  const colW=Math.min(40,cw/n-4);
  const gap=(cw-colW*n)/(n+1);
  const zeroY=padT+ch/2;
  let svg='<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:'+w+'px;display:block">';
  // Background
  svg+='<rect x="0" y="0" width="'+w+'" height="'+h+'" fill="#1a1a1a" rx="4"/>';
  // Zero line
  svg+='<line x1="'+padL+'" y1="'+zeroY+'" x2="'+(w-padR)+'" y2="'+zeroY+'" stroke="#444" stroke-width="0.8"/>';
  mkeys.forEach((m,i)=>{
    const v=vals[i];
    const bh=Math.max(2,Math.abs(v)/maxAbs*(ch/2-4));
    const cx=padL+gap+(i*(colW+gap))+(colW/2);
    const col=v>=0?'#4ade80':'#f87171';
    const barY=v>=0?zeroY-bh:zeroY;
    svg+='<rect x="'+(cx-colW/2).toFixed(1)+'" y="'+barY.toFixed(1)+'" width="'+colW.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+col+'" opacity="0.85" rx="2"/>';
    // Value label above/below bar
    const ldy=v>=0?barY-3:barY+bh+9;
    svg+='<text x="'+cx.toFixed(1)+'" y="'+ldy.toFixed(1)+'" fill="'+col+'" font-size="7.5" text-anchor="middle" font-weight="700">'+(v>=0?'+':'')+Math.round(v)+'</text>';
    // Month label at bottom
    const shortM=m.slice(5); // "MM"
    svg+='<text x="'+cx.toFixed(1)+'" y="'+(h-6)+'" fill="#888" font-size="8" text-anchor="middle">'+shortM+'</text>';
  });
  svg+='</svg>';
  return '<div class="card" style="background:#111;color:#fff;border-radius:8px;padding:14px 16px;margin-bottom:16px">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
    +'<div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#888">P&amp;L by Month (USD)</div>'
    +'<div><span style="font-size:18px;font-weight:700;color:'+pc+'">'+(totalPnL>=0?'+':'')+totalPnL.toFixed(2)+'</span>'
    +'<span style="font-size:10px;color:#666;margin-left:6px">realised total</span></div>'
    +'</div>'+svg+'</div>';
}

// ── Dashboard ──
function tjStatsBlock(label,trades,color){
  const ws=trades.map(t=>Object.assign({},t,{_status:tjDeriveStatus(t)}));
  const closed=ws.filter(t=>t._status!=='OPEN');
  const open=ws.filter(t=>t._status==='OPEN');
  const wins=closed.filter(t=>t._status==='WIN');
  const losses=closed.filter(t=>t._status==='LOSS');
  const pnl=ws.reduce((s,t)=>{const p=tjNetPnL(t);return s+(p||0);},0);
  const wr=closed.length?Math.round(wins.length/closed.length*100):0;
  const aw=wins.length?wins.reduce((s,t)=>s+(tjNetPnL(t)||0),0)/wins.length:0;
  const al=losses.length?losses.reduce((s,t)=>s+(tjNetPnL(t)||0),0)/losses.length:0;
  const bw=wins.length?Math.max(...wins.map(t=>tjNetPnL(t)||0)):0;
  const wl=losses.length?Math.min(...losses.map(t=>tjNetPnL(t)||0)):0;
  const pc=pnl>=0?'#1a7a4a':'#c0392b';
  if(!trades.length)return '<div class="card" style="border-top:3px solid '+color+';opacity:.5"><div style="font-size:12px;font-weight:700;color:'+color+';letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px">'+label+'</div><div style="color:#aaa;font-size:11px;padding:8px 0">No trades yet. Log your first '+label.toLowerCase().replace(/[^a-z ]/g,'')+' trade.</div></div>';
  return '<div class="card" style="border-top:3px solid '+color+'">'
    +'<div style="font-size:12px;font-weight:700;color:'+color+';letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px">'+label+'</div>'
    +'<div class="g4" style="margin-bottom:10px">'
    +tjStatCard('Total',trades.length,color)
    +tjStatCard('Win Rate',wr+'%','#1a7a4a',closed.length+' closed')
    +tjStatCard('Net P&L',(pnl>=0?'+':'')+pnl.toFixed(2),pc)
    +'<div style="background:#f5f5f5;border-radius:6px;padding:10px 12px;border-top:2px solid #888"><div class="lbl">Open / Closed</div>'
    +'<div style="font-size:18px;font-weight:700;color:#f59e0b">'+open.length+'<span style="font-size:12px;color:#888;font-weight:400"> / '+closed.length+'</span></div>'
    +'<div class="sub">'+trades.length+' total</div></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px">'
    +['<div style="background:#f9fafb;border-radius:4px;padding:7px 10px"><div style="color:#666;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Wins</div><div style="font-weight:700;color:#1a7a4a">'+wins.length+'</div></div>',
      '<div style="background:#f9fafb;border-radius:4px;padding:7px 10px"><div style="color:#666;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Losses</div><div style="font-weight:700;color:#c0392b">'+losses.length+'</div></div>',
      '<div style="background:#f9fafb;border-radius:4px;padding:7px 10px"><div style="color:#666;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Avg Win</div><div style="font-weight:700;color:#1a7a4a">'+(wins.length?'+$'+aw.toFixed(0):'—')+'</div></div>',
      '<div style="background:#f9fafb;border-radius:4px;padding:7px 10px"><div style="color:#666;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Avg Loss</div><div style="font-weight:700;color:#c0392b">'+(losses.length?'$'+al.toFixed(0):'—')+'</div></div>'
     ].join('')
    +'</div>'
    +(wins.length||losses.length?'<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;margin-top:6px">'
    +'<div style="background:#f9fafb;border-radius:4px;padding:7px 10px"><div style="color:#666;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Best Win</div><div style="font-weight:700;color:#1a7a4a">'+(wins.length?'+$'+bw.toFixed(2):'—')+'</div></div>'
    +'<div style="background:#f9fafb;border-radius:4px;padding:7px 10px"><div style="color:#666;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Worst Loss</div><div style="font-weight:700;color:#c0392b">'+(losses.length?'$'+wl.toFixed(2):'—')+'</div></div>'
    +'</div>':'')
    +'</div>';
}
function tjDashHTML(data){
  const trades=data.trades||[];
  const swingTrades=trades.filter(t=>(t.tradeType||'swing')==='swing');
  const posTrades=trades.filter(t=>t.tradeType==='position');
  const withStatus=trades.map(t=>Object.assign({},t,{_status:tjDeriveStatus(t)}));
  const closed=withStatus.filter(t=>t._status!=='OPEN');
  const wins=closed.filter(t=>t._status==='WIN');
  const losses=closed.filter(t=>t._status==='LOSS');
  const totalPnL=withStatus.reduce((s,t)=>{const p=tjNetPnL(t);return s+(p||0);},0);
  const openTrades=withStatus.filter(t=>t._status==='OPEN');
  const riskUsed=openTrades.length*TJ_ACCOUNT.maxRiskPerTrade;
  const maxRisk=TJ_ACCOUNT.maxRiskPerTrade*TJ_ACCOUNT.maxPositions;
  const riskPct=Math.min(riskUsed/maxRisk*100,100);
  const pc=totalPnL>=0?'#1a7a4a':'#c0392b';
  const wr=closed.length?Math.round(wins.length/closed.length*100):0;
  const grossWins=wins.reduce((s,t)=>{const p=tjNetPnL(t);return s+(p>0?p:0);},0);
  const grossLosses=losses.reduce((s,t)=>{const p=tjNetPnL(t);return s+(p<0?Math.abs(p):0);},0);
  const profitFactor=grossLosses>0?(grossWins/grossLosses):null;

  let html=tjNavBar('dashboard');

  // Combined dark header
  html+='<div style="background:#111;color:#fff;border-radius:8px;padding:14px 16px;margin-bottom:16px">'

    +'<div style="min-width:80px"><div style="font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">Net P&amp;L</div><div style="font-size:22px;font-weight:700;color:'+(totalPnL>=0?'#4ade80':'#f87171')+'">'+(totalPnL>=0?'+':'')+totalPnL.toFixed(2)+'</div></div>'
    +'<div style="min-width:80px"><div style="font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">Profit Factor</div>'
    +(profitFactor!==null
      ?'<div style="font-size:22px;font-weight:700;color:'+(profitFactor>=1?'#4ade80':'#f87171')+'">'+profitFactor.toFixed(2)+'</div><div style="font-size:10px;color:#666">'+(profitFactor>=2?'Excellent':profitFactor>=1.5?'Good':profitFactor>=1?'Marginal':'Poor')+'</div>'

    +'<div style="background:#333;border-radius:3px;height:4px;margin:5px 0 2px;overflow:hidden"><div style="height:100%;border-radius:3px;background:#fbbf24;width:'+riskPct+'%"></div></div>'
    +'<div style="font-size:10px;color:#666">$'+riskUsed+' / $'+maxRisk+'</div></div>'
    +'</div>'
    +'<div style="display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid #333">'
    +'<div style="font-size:11px"><span style="color:#4ade80;font-weight:700">'+wins.length+' W</span> &middot; <span style="color:#f87171;font-weight:700">'+losses.length+' L</span> &middot; <span style="color:#888">'+openTrades.length+' open</span></div>'
    +'<div style="font-size:11px;color:#666;margin-left:auto">⚡ Swing: '+swingTrades.length+' &nbsp;·&nbsp; 📈 Position: '+posTrades.length+'</div>'
    +'</div></div>';

  // Equity curve

  html+=inp('ticker','Ticker','text',f.ticker,'placeholder="e.g. CRWD"');
  html+=sel('tradeType','Trade Type',['swing','position'],f.tradeType||'swing');

  html+='</div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:10px">';
  html+=inp('entry','Entry ($)','number',f.entry,'placeholder="0.00"');
  html+=inp('sl','Stop Loss ($)','number',f.sl,'placeholder="0.00"');
  html+=inp('risk','Risk ($)','number',f.risk);
  html+=inp('entryFee','Entry Fee ($)','number',f.entryFee||'','placeholder="0.00 optional"');
  html+='</div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px">';
  html+='<div class="fld"><label>TP1 ($)'+(rrTp1?' <span style="color:#f59e0b;font-size:10px">'+rrTp1+'R</span>':'')+'</label><input type="number" id="tjf_tp1" value="'+f.tp1+'" placeholder="0.00" oninput="tjFld(\'tp1\',this.value)" style="width:100%;font-size:12px;font-family:inherit;padding:4px 6px;border:1px solid #ddd;border-radius:3px"></div>';
  html+='<div class="fld"><label>TP2 ($)'+(rrTp2?' <span style="color:#1a7a4a;font-size:10px">'+rrTp2+'R</span>':'')+'</label><input type="number" id="tjf_tp2" value="'+f.tp2+'" placeholder="0.00" oninput="tjFld(\'tp2\',this.value)" style="width:100%;font-size:12px;font-family:inherit;padding:4px 6px;border:1px solid #ddd;border-radius:3px"></div>';
  html+='<div class="fld"><label>Total Shares (auto)</label><input type="number" id="tjf_shares" value="'+f.shares+'" oninput="tjFld(\'shares\',this.value)" style="width:100%;font-size:12px;font-family:inherit;padding:4px 6px;border:1px solid #ddd;border-radius:3px;color:#185FA5;font-weight:600"></div>';
  html+='</div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">';
  html+=sel('marketContext','Market Context',['BULLISH','BEARISH','NEUTRAL','MIXED'],f.marketContext);
  html+='<div style="display:flex;gap:16px;align-items:flex-end;padding-bottom:2px">';
  html+='<label style="font-size:11px;color:#555;cursor:pointer;display:flex;align-items:center;gap:5px"><input type="checkbox" id="tjf_volumeConfirmed"'+(f.volumeConfirmed?' checked':'')+' onchange="tjFld(\'volumeConfirmed\',this.checked)"> Volume Confirmed</label>';
  html+='<label style="font-size:11px;color:#555;cursor:pointer;display:flex;align-items:center;gap:5px"><input type="checkbox" id="tjf_srClear"'+(f.srClear?' checked':'')+' onchange="tjFld(\'srClear\',this.checked)"> S/R Clear</label>';
  html+='</div></div>';
  html+='<div class="fld" style="margin-bottom:14px"><label>Notes</label><textarea id="tjf_notes" oninput="tjFld(\'notes\',this.value)" placeholder="Setup notes, lessons learned..." style="width:100%;font-size:12px;font-family:inherit;padding:5px 7px;border:1px solid #ddd;border-radius:3px;min-height:64px;resize:vertical">'+f.notes+'</textarea></div>';
  html+='<div style="display:flex;gap:8px">';
  html+='<button class="btn" onclick="tjNav(\'log\')">Cancel</button>';
  html+='<button class="btn" style="background:#111;color:#fff;border-color:#111;font-weight:600" onclick="tjSubmit()">'+(isEdit?'Update Trade':'Log Trade')+'</button>';
  html+='</div></div>';
  return html;
}

function tjFld(field,value){
  TJF[field]=value==='true'?true:value==='false'?false:value;
  if(['risk','entry','sl'].includes(field)){
    const s=tjCalcShares(TJF.risk,TJF.entry,TJF.sl);
    TJF.shares=s||TJF.shares;
    const sharesEl=document.getElementById('tjf_shares');
    if(sharesEl&&s)sharesEl.value=s;
  }
  if(['entry','sl','tp1','tp2'].includes(field)){
    const rr1=tjCalcRR(TJF.entry,TJF.sl,TJF.tp1),rr2=tjCalcRR(TJF.entry,TJF.sl,TJF.tp2);
    const l1=document.querySelector('#tjf_tp1 ~ label, #tjf_tp1');
    const el1=document.getElementById('tjf_tp1'),el2=document.getElementById('tjf_tp2');
    if(el1){const lbl=el1.closest('.fld')&&el1.closest('.fld').querySelector('label');if(lbl)lbl.innerHTML='TP1 ($)'+(rr1?' <span style="color:#f59e0b;font-size:10px">'+rr1+'R</span>':'');}
    if(el2){const lbl=el2.closest('.fld')&&el2.closest('.fld').querySelector('label');if(lbl)lbl.innerHTML='TP2 ($)'+(rr2?' <span style="color:#1a7a4a;font-size:10px">'+rr2+'R</span>':'');}
  }
}

function tjSubmit(){
  if(!TJF.date||!TJF.ticker||!TJF.entry||!TJF.sl){alert('Date, ticker, entry and stop loss are required.');return;}
  const data=tjLoad();
  const trade=Object.assign({},TJF,{exits:TJF.exits||[]});
  if(TJV.editId!==null){
    const idx=data.trades.findIndex(t=>t.id===TJV.editId);
    if(idx>-1)data.trades[idx]=Object.assign({},trade,{id:TJV.editId});
    TJV.editId=null;
  } else {
    data.trades.push(Object.assign({},trade,{id:Date.now().toString()}));
  }
  tjSave(data);
  TJF={date:'',ticker:'',tradeType:'swing',direction:'LONG',entry:'',sl:'',tp1:'',tp2:'',shares:'',risk:'200',entryFee:'',notes:'',marketContext:'NEUTRAL',volumeConfirmed:true,srClear:true,exits:[]};
  TJV.view='log';rTJ();
}

// ── Detail View ──
function tjDetailHTML(data){

  // Top 2-col: setup + summary

  html+='</div>';
  html+='<div class="sline"><div style="color:#888">Date</div><div>'+t.date+'</div></div>';

  html+='<div class="sline"><div style="color:#c0392b">Stop Loss</div><div style="color:#c0392b">$'+t.sl+'</div></div>';

  html+='<div class="sline"><div style="color:#1a7a4a">TP2'+(rrTp2?' ('+rrTp2+'R)':'')+'</div><div style="color:#1a7a4a">$'+t.tp2+'</div></div>';

  html+='<div class="sline" style="border-bottom:none"><div style="color:#888">Risk</div><div>$'+t.risk+'</div></div>';
  const totalEntryFees=tjEntryFeesTotal(t);

  html+='</div>';

  html+='<div class="card"><div class="ctitle">Position Summary</div>';
  html+='<div class="sline"><div style="color:#888">Total Shares</div><div>'+totalShares+'</div></div>';
  html+='<div class="sline"><div style="color:#888">Exited Shares</div><div>'+(totalShares-rem)+'</div></div>';
  html+='<div class="sline"><div style="color:#f59e0b">Remaining Open</div><div style="font-weight:700;color:#f59e0b">'+rem+'</div></div>';
  const grossPnL=tjTotalPnL(t);
  const totalFees=tjTotalFees(t);
  const netPnL=tjNetPnL(t);
  const grossColor=grossPnL&&grossPnL!==0?(grossPnL>0?'#1a7a4a':'#c0392b'):'#888';
  const netColor=netPnL&&netPnL!==0?(netPnL>0?'#1a7a4a':'#c0392b'):'#888';
  html+='<div class="sline"><div style="color:#888">Gross P&amp;L</div><div style="font-size:16px;font-weight:600;color:'+grossColor+'">'+(grossPnL!==null?tjFmtPnL(grossPnL):'—')+'</div></div>';
  if(totalFees>0)html+='<div class="sline"><div style="color:#888">Total Fees</div><div style="color:#c0392b">−$'+totalFees.toFixed(2)+'</div></div>';
  html+='<div class="sline"><div style="color:#888">Net P&amp;L'+(totalFees>0?' (after fees)':'')+'</div><div style="font-size:20px;font-weight:700;color:'+netColor+'">'+(netPnL!==null?tjFmtPnL(netPnL):'—')+'</div></div>';
  const rr=tjRealisedR(t);

  const rrNetColor=rr?(rr.netR>=0?'#1a7a4a':'#c0392b'):'#888';
  if(rr&&totalFees>0){
    html+='<div class="sline"><div style="color:#888">Gross R'+(rr.isRunning?' (running)':'')+'</div><div style="font-size:14px;font-weight:600;color:'+rrGrossColor+'">'+rr.grossLabel.replace(' (running)','')+'</div></div>';
  }
  html+='<div class="sline"><div style="color:#888">Realised R'+(rr&&rr.isRunning?' (running)':'')+(totalFees>0?' (net)':'')+'</div><div style="font-size:18px;font-weight:700;color:'+rrNetColor+'">'+(rr?rr.netLabel.replace(' (running)',''):'—')+'</div></div>';
  // Progress bar: % of position exited
  const pct=totalShares>0?Math.round((totalShares-rem)/totalShares*100):0;
  html+='<div style="margin-top:10px"><div style="font-size:10px;color:#888;margin-bottom:4px">Position closed: '+pct+'%</div>';
  html+='<div style="background:#eee;border-radius:3px;height:6px;overflow:hidden"><div style="height:100%;border-radius:3px;background:'+(rem===0?'#1a7a4a':'#f59e0b')+';width:'+pct+'%"></div></div></div>';
  html+='<div style="border-top:1px solid #f0f0f0;margin-top:12px;padding-top:10px">';
  html+='<div class="sline"><div style="color:#888">Market Context</div><div>'+tjBadge(t.marketContext,TJ_CTX_COLORS[t.marketContext])+'</div></div>';
  html+='<div class="sline"><div style="color:#888">Volume</div><div style="color:'+(t.volumeConfirmed?'#1a7a4a':'#c0392b')+'">'+(t.volumeConfirmed?'✓ Confirmed':'✗ Not Confirmed')+'</div></div>';
  html+='<div class="sline" style="border-bottom:none"><div style="color:#888">S/R Clear</div><div style="color:'+(t.srClear?'#1a7a4a':'#c0392b')+'">'+(t.srClear?'✓ Clear':'✗ Blocked')+'</div></div>';
  html+='</div></div>';
  html+='</div>'; // end g2

  // ── Tranches (position trades only) ──

    const trList=(t.tranches&&t.tranches.length)?t.tranches:[{id:'',date:t.date,price:t.entry,shares:t.shares,fee:t.entryFee,_legacy:true}];

    html+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px">'
      +'<thead><tr>'+['#','Date','Shares','Price','Fee','Cost',''].map(h=>'<th style="text-align:left;padding:5px 8px;font-size:10px;color:#666;text-transform:uppercase;border-bottom:1px solid #e5e5e5">'+h+'</th>').join('')+'</tr></thead>'
      +'<tbody>'+trList.map((tr,i)=>{
        const sh=parseFloat(tr.shares)||0,pr=parseFloat(tr.price)||0,fe=parseFloat(tr.fee)||0;
        const cost=sh*pr;
        return '<tr>'
          +'<td style="padding:6px 8px;border-bottom:1px solid #f0f0f0;color:#aaa">T'+(i+1)+'</td>'
          +'<td style="padding:6px 8px;border-bottom:1px solid #f0f0f0">'+tr.date+'</td>'
          +'<td style="padding:6px 8px;border-bottom:1px solid #f0f0f0;font-weight:600">'+sh+'</td>'
          +'<td style="padding:6px 8px;border-bottom:1px solid #f0f0f0">$'+tjFmtPrice(pr)+'</td>'
          +'<td style="padding:6px 8px;border-bottom:1px solid #f0f0f0;color:#c0392b">'+(fe>0?'−$'+fe.toFixed(2):'—')+'</td>'
          +'<td style="padding:6px 8px;border-bottom:1px solid #f0f0f0">$'+cost.toFixed(2)+'</td>'
          +'<td style="padding:6px 8px;border-bottom:1px solid #f0f0f0">'+(trList.length>1&&!tr._legacy?'<button class="delbtn" onclick="tjDelTranche(\''+t.id+'\',\''+tr.id+'\')">×</button>':'')+'</td>'

      }).join('')+'</tbody></table></div>';
    html+='<div style="background:#f9f9f9;border:1px solid #e5e5e5;border-radius:5px;padding:12px">';
    html+='<div style="font-size:11px;font-weight:600;margin-bottom:10px;color:#444">Add Tranche <span style="font-weight:400;color:#888">(scale into this position at a new price — average cost updates automatically)</span></div>';

    // Preview P&L
    html+='<div id="tjx_preview" style="font-size:11px;color:#888;margin-top:8px"></div>';
    html+='</div>';
  }
  html+='</div>'; // end exits card

  if(t.notes){
    html+='<div class="card"><div class="ctitle">Notes</div><p style="color:#555;font-size:12px;line-height:1.6;margin:0">'+t.notes+'</p></div>';

function tjAddExit(tradeId,maxShares){
  const shares=parseInt(TJX.shares)||maxShares;
  const price=parseFloat(TJX.price);
  if(!price){alert('Enter exit price.');return;}
  if(shares<1||shares>maxShares){alert('Shares must be between 1 and '+maxShares+'.');return;}
  const data=tjLoad();
  const t=data.trades.find(x=>x.id===tradeId);
  if(!t)return;
  if(!t.exits)t.exits=[];
  const fee=parseFloat(TJX.fee)||0;
  t.exits.push({id:'e'+Date.now(),date:TJX.date,shares:String(shares),price:String(price),type:TJX.type,fee:fee||undefined});
  tjSave(data);
  TJX={date:new Date().toISOString().slice(0,10),shares:'',price:'',type:'TP1',fee:''};
  rTJ();
}
function tjDelExit(tradeId,exitId){
  if(!confirm('Remove this exit?'))return;
  const data=tjLoad();
  const t=data.trades.find(x=>x.id===tradeId);
  if(!t||!t.exits)return;
  t.exits=t.exits.filter(x=>x.id!==exitId);
  tjSave(data);rTJ();
}
function tjAddTranche(tradeId){
  const price=parseFloat(TJT.price);
  const shares=parseInt(TJT.shares);
  if(!price||!shares){alert('Enter tranche price and shares.');return;}
  const data=tjLoad();
  const t=data.trades.find(x=>x.id===tradeId);
  if(!t)return;
  if(!t.tranches||!t.tranches.length){
    // migrate the existing single entry into tranche 1 first
    t.tranches=[{id:'tr0_'+t.id,date:t.date,price:String(t.entry),shares:String(t.shares),fee:t.entryFee||undefined}];
  }
  const fee=parseFloat(TJT.fee)||0;
  t.tranches.push({id:'tr'+Date.now(),date:TJT.date,price:String(price),shares:String(shares),fee:fee||undefined});
  tjSave(data);
  TJT={date:new Date().toISOString().slice(0,10),shares:'',price:'',fee:''};
  rTJ();
}
function tjDelTranche(tradeId,trId){
  if(!confirm('Remove this tranche?'))return;
  const data=tjLoad();
  const t=data.trades.find(x=>x.id===tradeId);
  if(!t||!t.tranches)return;
  if(t.tranches.length<=1){alert('A trade needs at least one tranche — delete the whole trade instead.');return;}
  t.tranches=t.tranches.filter(x=>x.id!==trId);
  tjSave(data);rTJ();
}
function tjEditTrade(id){
  const data=tjLoad();
  const t=data.trades.find(x=>x.id===id);
  if(!t)return;
  TJF=Object.assign({},t,{exits:t.exits?t.exits.map(x=>Object.assign({},x)):[]});
  TJV.editId=id;TJV.view='add';rTJ();
}
function tjDeleteTrade(id){
  if(!confirm('Delete this trade?'))return;
  const data=tjLoad();
  data.trades=data.trades.filter(t=>t.id!==id);
  tjSave(data);TJV.view='log';rTJ();
}

// ── OPTIONS (WHEEL STRATEGY) ────────────────────────────────────────────────
// Separate from the stock trading journal — own storage, own stats.
// Starting scope: cash-secured puts (CSPs) only. Covered-call leg + multi-leg
// spreads intentionally left out for now; schema has room to extend.
// trade: {id,date,ticker,strike,expiry,contracts,premium,entryFee,notes,
//         marketContext, outcome:null|'expired_worthless'|'closed_early'|'assigned',
//         closeDate,closePrice,closeFee, assignedDate, linkedTradeId}
const TJ_OPTIONS_SEED=[];
const OPT_STORAGE_KEY='sg_options_v1';

function oLoad(){
  try{
    const r=localStorage.getItem(OPT_STORAGE_KEY);
    if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.trades))return d;}
  }catch(e){}
  const fresh={trades:TJ_OPTIONS_SEED.map(o=>Object.assign({},o))};
  oSave(fresh);return fresh;
}
function oSave(data){try{localStorage.setItem(OPT_STORAGE_KEY,JSON.stringify(data));}catch(e){}}

// ── Helpers ──
function oDTE(entryDate,expiry){
  if(!entryDate||!expiry)return null;
  const a=new Date(entryDate+'T00:00:00'),b=new Date(expiry+'T00:00:00');
  const d=Math.round((b-a)/86400000);
  return isFinite(d)?d:null;
}
function oCollateral(o){return(parseFloat(o.strike)||0)*100*(parseFloat(o.contracts)||0);}
function oPremiumTotal(o){return(parseFloat(o.premium)||0)*100*(parseFloat(o.contracts)||0);}
function oAnnYield(o){
  const dte=oDTE(o.date,o.expiry);
  const coll=oCollateral(o);
  if(!dte||dte<=0||!coll)return null;
  return oPremiumTotal(o)/coll*(365/dte)*100;
}
function oCostBasisPerShare(o){return(parseFloat(o.strike)||0)-(parseFloat(o.premium)||0);}
function oStatus(o){return o.outcome||'OPEN';}
// Net P&L — null while open (nothing realised yet)
function oNetPnL(o){
  if(!o.outcome)return null;
  const premTotal=oPremiumTotal(o);
  const entryFee=parseFloat(o.entryFee)||0;
  if(o.outcome==='expired_worthless')return premTotal-entryFee;
  if(o.outcome==='closed_early'){
    const closeCost=(parseFloat(o.closePrice)||0)*100*(parseFloat(o.contracts)||0);
    const closeFee=parseFloat(o.closeFee)||0;
    return premTotal-closeCost-entryFee-closeFee;
  }
  if(o.outcome==='assigned')return premTotal-entryFee; // premium kept; cost-basis effect lives on the linked stock lot
  return null;
}
const OPT_STATUS_COLORS={OPEN:'#f59e0b',expired_worthless:'#1a7a4a',closed_early:'#185FA5',assigned:'#7c3aed'};
const OPT_STATUS_LABELS={OPEN:'OPEN',expired_worthless:'EXPIRED WORTHLESS',closed_early:'CLOSED EARLY',assigned:'ASSIGNED'};

}

      html+='<div class="fld"><label>Close Date</label><input type="date" id="oout_closeDate" value="'+OOUT.closeDate+'" oninput="OOUT.closeDate=this.value" style="width:100%;font-size:12px;font-family:inherit;padding:4px 6px;border:1px solid #ddd;border-radius:3px"></div>';
      html+='<div class="fld"><label>Buyback Price ($/contract)</label><input type="number" id="oout_closePrice" value="'+OOUT.closePrice+'" placeholder="0.00" oninput="OOUT.closePrice=this.value" style="width:100%;font-size:12px;font-family:inherit;padding:4px 6px;border:1px solid #ddd;border-radius:3px"></div>';
      html+='<div class="fld"><label>Close Fee ($)</label><input type="number" id="oout_closeFee" value="'+OOUT.closeFee+'" placeholder="0.00 optional" oninput="OOUT.closeFee=this.value" style="width:100%;font-size:12px;font-family:inherit;padding:4px 6px;border:1px solid #ddd;border-radius:3px"></div>';
    } else if(OOUT.outcome==='assigned'){
      html+='<div class="fld"><label>Assignment Date</label><input type="date" id="oout_closeDate" value="'+OOUT.closeDate+'" oninput="OOUT.closeDate=this.value" style="width:100%;font-size:12px;font-family:inherit;padding:4px 6px;border:1px solid #ddd;border-radius:3px"></div>';
      html+='<div style="grid-column:span 2;font-size:10px;color:#888;padding-bottom:6px">Creates a linked stock position lot at cost basis $'+oCostBasisPerShare(o).toFixed(2)+' (strike − premium), '+((parseFloat(o.contracts)||0)*100)+' shares.</div>';
    } else {
      html+='<div style="grid-column:span 3;font-size:10px;color:#888;padding-bottom:6px">Full premium ($'+oPremiumTotal(o).toFixed(2)+') kept, no shares assigned.</div>';
    }
    html+='<div><button class="btn" style="background:#111;color:#fff;border-color:#111;font-weight:600;white-space:nowrap" onclick="oSubmitOutcome(\''+o.id+'\')">Record Outcome</button></div>';
    html+='</div></div>';
  }

  if(o.notes){
    html+='<div class="card"><div class="ctitle">Notes</div><p style="color:#555;font-size:12px;line-height:1.6;margin:0">'+o.notes+'</p></div>';
  }
  return html;
}
function oSubmitOutcome(id){
  const data=oLoad();
  const o=data.trades.find(x=>x.id===id);
  if(!o)return;
  o.outcome=OOUT.outcome;
  if(OOUT.outcome==='closed_early'){
    if(!OOUT.closePrice){alert('Enter the buyback price.');return;}
    o.closeDate=OOUT.closeDate;o.closePrice=OOUT.closePrice;o.closeFee=OOUT.closeFee||undefined;
  } else if(OOUT.outcome==='assigned'){
    o.assignedDate=OOUT.closeDate||o.expiry;
    const costBasis=oCostBasisPerShare(o);
    const shares=(parseFloat(o.contracts)||0)*100;
    const stockData=tjLoad();
    const linkedId='wheel_'+o.id;
    if(!stockData.trades.some(t=>t.id===linkedId)){
      stockData.trades.push({
        id:linkedId,date:o.assignedDate,ticker:o.ticker,tradeType:'position',direction:'LONG',
        entry:String(costBasis),sl:'',tp1:'',tp2:'',shares:String(shares),risk:'',entryFee:'',
        notes:'Assigned via wheel CSP — strike $'+o.strike+', premium $'+o.premium+'/contract × '+o.contracts+' contract'+(o.contracts>1?'s':'')+'. Cost basis reflects premium collected.',
        marketContext:o.marketContext||'NEUTRAL',volumeConfirmed:true,srClear:true,exits:[]
      });
      tjSave(stockData);
    }
    o.linkedTradeId=linkedId;
  }
  oSave(data);
  OOUT={outcome:'expired_worthless',closeDate:new Date().toISOString().slice(0,10),closePrice:'',closeFee:''};
  rTJ();
}

// ── END TRADING JOURNAL ───────────────────────────────────────────────────────

rCF();
</script>
